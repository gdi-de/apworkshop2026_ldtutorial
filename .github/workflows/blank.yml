# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request: 
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch: 

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  
  mapit:

    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    uses: situx/geordfconverter/.github/workflows/geordfconvert.yml@main
    with: 
        input: source/trinkwasser_brunnen_berlin.geojson
        output: docs
        ghpages: true
        mapping: mappings/trinkwasserbrunnen.json
        sepchar: ";"

  mapit2:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    uses: situx/geordfconverter/.github/workflows/geordfconvert.yml@main
    needs: mapit
    with: 
        input: source/baumkataster_berlin.geojson
        output: docs
        ghpages: true
        mapping: mappings/baumkataster.json
        sepchar: ";"
  
  # This workflow contains a single job called "build"  
  build:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    uses: sparqlunicorn/sparqlunicornGoesGIS-ontdoc/.github/workflows/udoc.yml@main
    needs: 
      - mapit
      - mapit2
    with: 
        version: v018
        rdffilepath: ap_result.ttl
        docpath: docs
        prefixns: http://gdi-de.github.io/apworkshop2026/
        prefixnsshort: gdide
        indexpages: true
        createcollections: true
        createnonNSPages: true
        createVOWL: true
        metadatatable: true
        preferredlang: en
        license: CC BY 4.0
        ghpages: true
